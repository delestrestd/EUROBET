name: Patch Calendriers HTML
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-calendriers.yml'
      - 'scripts/patch_calendriers_html.py'
      - 'calendrier-addon.js'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply Calendriers hooks to HTML
        run: python3 scripts/patch_calendriers_html.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html euro-football-live.html
          git diff --staged --quiet || git commit -m "feat(calendriers): wire Calendriers tab hooks in HTML"
          git push
