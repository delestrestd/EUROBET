name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          # Site = index.html à la racine + assets PWA
          if [ -f index.html ]; then cp index.html _site/; fi
          if [ -f euro-football-live.html ] && [ ! -f _site/index.html ]; then
            cp euro-football-live.html _site/index.html
          fi
          if [ -f euro-football-live.html ]; then cp euro-football-live.html _site/; fi
          for f in manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png apple-touch-icon.png; do
            [ -f "$f" ] && cp "$f" _site/
          done
          ls -la _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
