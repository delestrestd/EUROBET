name: Patch Addon LoadParts
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_addon_loadparts.py'
      - '.github/workflows/patch-addon-loadparts.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run patch script
        run: python3 scripts/patch_addon_loadparts.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendrier-addon.js
          git diff --staged --quiet || git commit -m "fix(calendriers): addon loads part0-3 via loadParts()"
          git push
