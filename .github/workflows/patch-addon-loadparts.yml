name: Patch Addon LoadParts
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-addon-loadparts.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch ensureData to load parts
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('calendrier-addon.js')
          t = p.read_text(encoding='utf-8')
          if 'async function loadParts()' in t and 'await loadParts()' in t:
              print('already patched')
          else:
              needle = "async function ensureData() {\n    if (calendrierData) return calendrierData;\n    try {\n      calendrierData = await loadGzipB64('./calendrier-data.gz.b64');\n    } catch (e) {\n      const j = await fetch('./calendrier-data.json', { cache: 'no-cache' });\n      if (!j.ok) throw e;\n      calendrierData = await j.json();\n    }\n    return calendrierData;\n  }"
              insert = """async function loadParts() {
    const texts = await Promise.all([0, 1, 2, 3].map(async (i) => {
      const r = await fetch('./calendrier-data.gz.b64.part' + i, { cache: 'no-cache' });
      if (!r.ok) throw new Error('part' + i + ' HTTP ' + r.status);
      return (await r.text()).trim();
    }));
    const b64 = texts.join('');
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    if (typeof DecompressionStream === 'undefined') throw new Error('DecompressionStream indisponible');
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    return JSON.parse(await new Response(stream).text());
  }

  async function ensureData() {
    if (calendrierData) return calendrierData;
    try {
      calendrierData = await loadParts();
    } catch (e1) {
      try {
        calendrierData = await loadGzipB64('./calendrier-data.gz.b64');
      } catch (e) {
        const j = await fetch('./calendrier-data.json', { cache: 'no-cache' });
        if (!j.ok) throw e1;
        calendrierData = await j.json();
      }
    }
    return calendrierData;
  }"""
              if needle not in t:
                  raise SystemExit('needle not found')
              t = t.replace(needle, insert, 1)
              p.write_text(t, encoding='utf-8')
              print('patched', len(t))
          assert 'await loadParts()' in p.read_text(encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendrier-addon.js
          git diff --staged --quiet || git commit -m "fix(calendriers): addon loads part0-3 via loadParts()"
          git push
