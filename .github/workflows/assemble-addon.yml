name: Assemble calendrier-addon.js
on:
  workflow_dispatch:
  push:
    paths:
      - 'calendrier-addon.js.hex*'
      - '.github/workflows/assemble-addon.yml'
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble addon from hex
        run: |
          python3 <<'PY'
          from pathlib import Path
          import hashlib, re
          expect = 'cccac819afb256b2ff73ce605473deb8eef696bf2b16dc4959b62ff4b6a6f729'
          n = 6
          hx = ''.join(re.sub(r'[^0-9a-f]', '', Path(f'calendrier-addon.js.hex{i}').read_text().lower()) for i in range(n))
          data = bytes.fromhex(hx)
          got = hashlib.sha256(data).hexdigest()
          print('addon', len(data), got)
          assert got == expect, (got, expect)
          Path('calendrier-addon.js').write_bytes(data)
          for i in range(n):
              p = Path(f'calendrier-addon.js.hex{i}')
              if p.exists():
                  p.unlink(); print('removed', p)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "feat(calendriers): cup highlight addon UI (C1 gold / C3 blue / C4 green)"
          git push
